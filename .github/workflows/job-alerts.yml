name: Tali job alerts

on:
  schedule:
    # Monday-Friday at 10:17 AM Arizona time (17:17 UTC; Arizona = UTC-7).
    # :17 instead of :00 because GitHub runs are often late at the top of the hour.
    - cron: "17 17 * * 1-5"
  workflow_dispatch:   # adds a "Run workflow" button for testing

permissions:
  contents: write

concurrency:
  group: job-alerts

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check for new jobs
        run: python3 job_alerts.py
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      - name: Remember jobs already sent
        run: |
          git config user.name "job-alerts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff --cached --quiet || (git commit -m "Update seen jobs" && git push)
